spring.application.name=stock-service
server.port=8082

spring.datasource.url=jdbc:mysql://${STOCK_DB_HOST}:3306/stock_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${STOCK_DB_USERNAME}
spring.datasource.password=${STOCK_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

kis.app-key=${KIS_APP_KEY}
kis.app-secret=${KIS_APP_SECRET}
kis.base-url=https://openapivts.koreainvestment.com:29443

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:10.0.3.159:9092}
spring.kafka.consumer.group-id=stock-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer