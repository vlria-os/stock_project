name: Gateway Service Deploy

"on":
  push:
    branches: [main]
    paths:
      - 'gateway-service/**'

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: invest/spring/gateway-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TRADE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TRADE_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image
        run: |
          IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -t $IMAGE ./gateway-service
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Gateway EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GATEWAY_EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.BASTION_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ env.IMAGE }}
            docker stop gateway-service || true
            docker rm gateway-service || true
            docker run -d --name gateway-service -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              ${{ env.IMAGE }}