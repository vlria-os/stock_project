name: User Service Deploy
"on":
  push:
    branches: [main]
    paths:
      - 'user-service/**'
  workflow_dispatch:
  
env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: invest/spring/user-service
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.USER_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.USER_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & Push image
        run: |
          IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          LATEST=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker build -t $IMAGE ./user-service
          docker tag $IMAGE $LATEST
          docker push $IMAGE
          docker push $LATEST
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: Deploy via Bastion
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ubuntu
          key: ${{ secrets.BASTION_SSH_KEY }}
          script: |
            ssh -i ~/.ssh/aws-invest-key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.USER_EC2_PRIVATE_IP }} "
              aws configure set aws_access_key_id ${{ secrets.USER_AWS_ACCESS_KEY_ID }}
              aws configure set aws_secret_access_key ${{ secrets.USER_AWS_SECRET_ACCESS_KEY }}
              aws configure set region ap-northeast-2
              aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
              docker pull ${{ env.IMAGE }}
              docker stop user-service || true
              docker rm user-service || true
              docker run -d --name user-service -p 8081:8081 \
                -e USER_DB_HOST=${{ secrets.USER_DB_HOST }} \
                -e USER_DB_USERNAME=${{ secrets.USER_DB_USERNAME }} \
                -e USER_DB_PASSWORD=${{ secrets.USER_DB_PASSWORD }} \
                -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
                -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
                -e SPRING_PROFILES_ACTIVE=prod \
                ${{ env.IMAGE }}
            "
