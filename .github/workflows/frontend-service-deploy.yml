name: Frontend Service Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'react/**'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push frontend image
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          docker build \
            -t $REGISTRY/invest/react/front:${{ github.sha }} \
            -t $REGISTRY/invest/react/front:latest \
            ./react
          docker push $REGISTRY/invest/react/front:${{ github.sha }}
          docker push $REGISTRY/invest/react/front:latest

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name my-cluster --region ap-northeast-2
          kubectl set image deployment/frontend frontend=${{ secrets.ECR_REGISTRY }}/invest/react/front:${{ github.sha }}
          kubectl rollout status deployment/frontend
