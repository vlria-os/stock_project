name: Frontend Service Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'react/**'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push frontend image
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          docker build \
            -t $REGISTRY/frontend:${{ github.sha }} \
            -t $REGISTRY/frontend:latest \
            ./react
          docker push $REGISTRY/frontend:${{ github.sha }}
          docker push $REGISTRY/frontend:latest

      - name: Deploy to Frontend EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.FRONTEND_EC2_HOST }}
          username: ${{ secrets.FRONTEND_EC2_USER }}
          key:      ${{ secrets.FRONTEND_EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            docker pull ${{ secrets.ECR_REGISTRY }}/frontend:latest

            docker stop frontend || true
            docker rm   frontend || true
            docker run -d \
              --name frontend \
              --restart always \
              -p 80:80 \
              ${{ secrets.ECR_REGISTRY }}/frontend:latest

            docker image prune -f
