name: Trade Service Deploy

"on":
  push:
    branches: [main]
    paths:
      - 'trade-service/**'

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: invest/spring/trade-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TRADE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TRADE_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image
        run: |
          IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -t $IMAGE ./trade-service
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy via Bastion
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ubuntu
          key: ${{ secrets.BASTION_SSH_KEY }}
          script: |
            ssh -i ~/.ssh/aws-invest-key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.TRADE_EC2_PRIVATE_IP }} "
              aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
              docker pull ${{ env.IMAGE }}
              docker stop trade-service || true
              docker rm trade-service || true
              docker run -d --name trade-service -p 8084:8084 \
                -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
                -e KAFKA_HOST=${{ secrets.KAFKA_HOST }} \
                -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
                -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                -e TRADE_KIS_APP_KEY=${{ secrets.TRADE_KIS_APP_KEY }} \
                -e TRADE_KIS_APP_SECRET=${{ secrets.TRADE_KIS_APP_SECRET }} \
                -e TRADE_KIS_REST_URL=${{ secrets.TRADE_KIS_REST_URL }} \
                -e TRADE_KIS_WS_URL=${{ secrets.TRADE_KIS_WS_URL }} \
                -e SPRING_PROFILES_ACTIVE=prod \
                ${{ env.IMAGE }}
            "
