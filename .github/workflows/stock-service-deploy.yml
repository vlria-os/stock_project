name: Stock Service Deploy
"on":
  push:
    branches: [main]
    paths:
      - 'stock-service/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: invest/spring/stock-service
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.STOCK_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.STOCK_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Check files
        run: |
          ls -la ./stock-service/src/main/java/com/example/demo/kafka/
          cat ./stock-service/src/main/java/com/example/demo/kafka/UserEventConsumer.java
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Test build
        run: |
          cd ./stock-service
          chmod +x gradlew
          ./gradlew bootJar -x test
          jar tf build/libs/*.jar | grep -i "UserEvent\|kafka"
      - name: Build & Push image
        run: |
          IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          LATEST=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker build --no-cache -t $IMAGE ./stock-service
          docker tag $IMAGE $LATEST
          docker push $IMAGE
          docker push $LATEST
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name my-cluster --region ap-northeast-2
          kubectl set image deployment/stock-service stock-service=${{ env.IMAGE }}
          kubectl rollout status deployment/stock-service
