name: Balance Service Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'balance-service/**'
  workflow_dispatch:

jobs:
  deploy-balance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push balance image
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          docker build \
            -t $REGISTRY/invest/spring/balance:${{ github.sha }} \
            -t $REGISTRY/invest/spring/balance:latest \
            ./balance-service
          docker push $REGISTRY/invest/spring/balance:${{ github.sha }}
          docker push $REGISTRY/invest/spring/balance:latest

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name my-cluster --region ap-northeast-2
          kubectl set image deployment/balance-service balance-service=${{ secrets.ECR_REGISTRY }}/invest/spring/balance:${{ github.sha }}
          kubectl rollout status deployment/balance-service
