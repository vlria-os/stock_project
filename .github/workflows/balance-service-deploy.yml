name: Balance Service Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'balance-service/**'

jobs:
  deploy-balance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push balance image
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          docker build \
            -t $REGISTRY/balance:${{ github.sha }} \
            -t $REGISTRY/balance:latest \
            ./balance-service
          docker push $REGISTRY/balance:${{ github.sha }}
          docker push $REGISTRY/balance:latest

      - name: Deploy to Balance EC2 (via Bastion)
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.BASTION_HOST }}
          username: ubuntu
          key:      ${{ secrets.BASTION_SSH_KEY }}
          script: |
            ssh -o StrictHostKeyChecking=no \
                -i /home/ubuntu/balance-key.pem \
                ubuntu@${{ secrets.BALANCE_EC2_HOST }} << 'REMOTE'

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            docker pull ${{ secrets.ECR_REGISTRY }}/balance:latest

            docker stop balance || true
            docker rm   balance || true
            docker run -d \
              --name balance \
              --restart always \
              -p 8081:8081 \
              ${{ secrets.ECR_REGISTRY }}/balance:latest

            docker image prune -f
            REMOTE
