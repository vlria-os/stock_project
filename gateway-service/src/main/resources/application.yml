spring:
  application:
    name: gateway-service
  data:
    redis:
      host: 10.0.3.159
      port: 6379
  cloud:
    discovery:
      enabled: false
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service
          uri: http://10.0.3.195:8081
          predicates:
            - Path=/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        - id: balance-service
          uri: http://10.0.3.245:8083
          predicates:
            - Path=/api/balance/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        - id: trade-service
          uri: http://10.0.3.103:8084
          predicates:
            - Path=/api/trade/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        - id: trade-service-ws
          uri: ws://10.0.3.103:8084
          predicates:
            - Path=/ws/**
        - id: stock-service
          uri: http://10.0.3.110:8082
          predicates:
            - Path=/stocks/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
jwt:
  secret: ${JWT_SECRET}
server:
  port: 8080
