spring.application.name=trade-service

server.port=8084

#EKS: prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

#MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://myrds.cbuasssoms44.ap-northeast-2.rds.amazonaws.com/trade_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=admin
spring.datasource.password=12341234

#JPA
spring.jpa.hibernate.ddl-auto=update

#Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

#Kafka
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=trade-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

balance.service.url=http://localhost:8083
stock.service.url=http://localhost:8082