spring.application.name=user-service
server.port=8081

spring.datasource.url=jdbc:mysql://${USER_DB_HOST}:3306/user_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${USER_DB_USERNAME}
spring.datasource.password=${USER_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=clustercfg.invest-redis.l9metn.apn2.cache.amazonaws.com
spring.data.redis.port=6379

jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=kafka.default.svc.cluster.local:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
